name: Production Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloud-worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-worker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloud-worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-worker.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-worker
  cancel-in-progress: false

env:
  BRIDGE_SMOKE_URL: https://lucky-heart-f5b9.chatgpt-bridge.workers.dev

jobs:
  deployment-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify operator deployment secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi
          echo "Cloudflare deployment credentials are configured for GitHub Actions."

  deploy-and-verify:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy current main Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment secrets are not configured."
            exit 1
          fi
          npx wrangler deploy --config cloud-worker/wrangler.jsonc
      - name: Wait for public Worker readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 "$BRIDGE_SMOKE_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production Worker did not become healthy after deployment."
          exit 1
      - name: Verify production OAuth, MCP relay, refresh rotation, and multi-window routing
        run: npm run smoke:production --workspace cloud-worker

  scheduled-production-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detect production drift or protocol regression
        run: npm run smoke:production --workspace cloud-worker
