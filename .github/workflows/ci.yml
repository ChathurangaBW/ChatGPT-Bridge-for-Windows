name: CI

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency audit
        run: npm audit --json
        continue-on-error: true
      - name: Emit generated lockfile for release QA
        run: Get-Content package-lock.json -Raw
      - run: npm run qa
