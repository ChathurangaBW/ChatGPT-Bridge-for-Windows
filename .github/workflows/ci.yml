name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run qa
      - name: Package VS Code extension
        run: npm run package:vscode
      - name: Export generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: qa-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Export VSIX
        uses: actions/upload-artifact@v7
        with:
          name: chatgpt-bridge-vscode-0.1.0
          path: artifacts/chatgpt-bridge-vscode-0.1.0.vsix
          if-no-files-found: error
