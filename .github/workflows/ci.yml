name: CI

on:
  push:
    branches:
      - main
      - qa/final-v0.1-hardening
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Bootstrap locked dependencies
        run: npm install
      - name: Persist generated lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/qa/final-v0.1-hardening'
        shell: pwsh
        run: |
          $change = git status --porcelain -- package-lock.json
          if ($change) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock release packaging toolchain"
            git push origin HEAD:${{ github.ref_name }}
          }
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run qa
      - name: Package release artifacts
        run: npm run package:release
      - name: Smoke packaged bridge executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\artifacts\ChatGPTBridge.exe" -PassThru -WindowStyle Hidden
          $collision = $null
          $badConfig = $null
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) {
                throw "ChatGPTBridge.exe exited before the health endpoint became available (exit code $($process.ExitCode))."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:47322/health" -TimeoutSec 1
                if ($health.ok -eq $true -and $health.vscodeConnected -eq $false) {
                  $ready = $true
                  break
                }
              } catch {
                # The packaged process may still be starting.
              }
            }
            if (-not $ready) {
              throw "ChatGPTBridge.exe did not expose a healthy loopback endpoint within the smoke-test window."
            }

            $collision = Start-Process -FilePath ".\artifacts\ChatGPTBridge.exe" -PassThru -WindowStyle Hidden
            if (-not $collision.WaitForExit(10000)) {
              throw "A second ChatGPTBridge.exe instance did not fail on occupied default ports."
            }
            if ($collision.ExitCode -eq 0) {
              throw "A second ChatGPTBridge.exe instance unexpectedly exited successfully on occupied ports."
            }

            $healthAfterCollision = Invoke-RestMethod -Uri "http://127.0.0.1:47322/health" -TimeoutSec 2
            if ($healthAfterCollision.ok -ne $true) {
              throw "The original bridge became unhealthy after the port-collision smoke test."
            }

            $badConfig = Start-Process -FilePath ".\artifacts\ChatGPTBridge.exe" -PassThru -WindowStyle Hidden -Environment @{
              BRIDGE_WS_PORT = "47321abc"
              BRIDGE_MCP_PORT = "57322"
            }
            if (-not $badConfig.WaitForExit(10000)) {
              throw "ChatGPTBridge.exe did not reject a malformed BRIDGE_WS_PORT value."
            }
            if ($badConfig.ExitCode -eq 0) {
              throw "ChatGPTBridge.exe unexpectedly accepted a malformed BRIDGE_WS_PORT value."
            }
          } finally {
            foreach ($candidate in @($badConfig, $collision, $process)) {
              if ($null -ne $candidate -and -not $candidate.HasExited) {
                Stop-Process -Id $candidate.Id -Force
              }
            }
          }
      - name: Export release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chatgpt-bridge-windows-0.1.0
          path: |
            artifacts/ChatGPTBridge.exe
            artifacts/chatgpt-bridge-vscode-0.1.0.vsix
          if-no-files-found: error
