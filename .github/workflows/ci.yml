name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run qa
      - name: Smoke cloud OAuth and MCP relay
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "cloud-worker.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "cloud-worker.err.log"
          $worker = Start-Process -FilePath "npm.cmd" -ArgumentList @(
            "run", "dev", "--workspace", "cloud-worker", "--", "--port", "8787"
          ) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($worker.HasExited) {
                Get-Content $stdout -ErrorAction SilentlyContinue
                Get-Content $stderr -ErrorAction SilentlyContinue
                throw "Wrangler dev exited before /health became ready (exit code $($worker.ExitCode))."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 1
                if ($health.ok -eq $true) {
                  $ready = $true
                  break
                }
              } catch {
                # workerd may still be starting.
              }
            }
            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Cloud Worker did not expose /health within the smoke-test window."
            }
            npm run smoke --workspace cloud-worker
            if ($LASTEXITCODE -ne 0) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Cloud relay runtime smoke failed."
            }
          } finally {
            if (-not $worker.HasExited) {
              Stop-Process -Id $worker.Id -Force
            }
          }
      - name: Package single VSIX release
        shell: pwsh
        run: |
          Remove-Item ".\artifacts" -Recurse -Force -ErrorAction SilentlyContinue
          npm run package:release
          if ($LASTEXITCODE -ne 0) { throw "VSIX release packaging failed." }
          $files = @(Get-ChildItem ".\artifacts" -File -Recurse)
          if ($files.Count -ne 1) {
            throw "Release output must contain exactly one file; found $($files.Count)."
          }
          if ($files[0].Name -ne "chatgpt-bridge-vscode-0.2.0.vsix") {
            throw "Unexpected release artifact: $($files[0].FullName)"
          }
      - name: Smoke packaged VSIX
        shell: pwsh
        run: |
          $vsix = ".\artifacts\chatgpt-bridge-vscode-0.2.0.vsix"
          if (-not (Test-Path $vsix)) { throw "VSIX was not produced." }
          if (Test-Path ".\artifacts\ChatGPTBridge.exe") { throw "Release unexpectedly contains ChatGPTBridge.exe." }

          $temp = Join-Path $env:RUNNER_TEMP "chatgpt-bridge-vsix"
          $zip = Join-Path $env:RUNNER_TEMP "chatgpt-bridge-vsix.zip"
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Copy-Item $vsix $zip
          Expand-Archive -Path $zip -DestinationPath $temp -Force

          $packagePath = Join-Path $temp "extension\package.json"
          $manifestPath = Join-Path $temp "extension.vsixmanifest"
          $bundlePath = Join-Path $temp "extension\dist\extension.js"
          $readmePath = Join-Path $temp "extension\readme.md"
          foreach ($required in @($packagePath, $manifestPath, $bundlePath, $readmePath)) {
            if (-not (Test-Path $required)) { throw "Required VSIX entry is missing: $required" }
          }

          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          if ($package.version -ne "0.2.0") { throw "Unexpected VSIX package version: $($package.version)" }
          if ($package.publisher -ne "chathurangabw") { throw "Unexpected VSIX publisher: $($package.publisher)" }
          if ($package.main -ne "./dist/extension.js") { throw "Unexpected VSIX entry point: $($package.main)" }
          if ($package.description -match "local ChatGPT Bridge service") { throw "VSIX still advertises the removed local companion service." }

          $bundle = Get-Content $bundlePath -Raw
          if ($bundle -notmatch "lucky-heart-f5b9\.chatgpt-bridge\.workers\.dev") { throw "VSIX bundle does not contain the production cloud relay endpoint." }
          if ($bundle -notmatch "wss:") { throw "VSIX bundle does not contain secure WebSocket relay handling." }

          $exe = Get-ChildItem $temp -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($exe) { throw "VSIX unexpectedly contains an executable." }

          $textFiles = Get-ChildItem $temp -Recurse -File | Where-Object { $_.Extension -in @(".js", ".json", ".md", ".xml", ".vsixmanifest") }
          $forbiddenPatterns = @(
            "ChatGPTBridge\.exe",
            "ws://127\.0\.0\.1",
            "http://127\.0\.0\.1",
            "localhost:47321",
            "localhost:47322",
            "OPENAI_API_KEY",
            "CLOUDFLARE_API_TOKEN",
            "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----",
            "sk-[A-Za-z0-9_-]{20,}"
          )
          foreach ($file in $textFiles) {
            $text = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
            foreach ($pattern in $forbiddenPatterns) {
              if ($text -match $pattern) { throw "Forbidden release marker '$pattern' found in $($file.FullName)." }
            }
          }
      - name: Smoke clean VS Code profile install and uninstall
        shell: pwsh
        run: |
          $code = Get-Command code -ErrorAction SilentlyContinue
          if (-not $code) { throw "VS Code CLI is not available on the Windows release runner." }
          $userData = Join-Path $env:RUNNER_TEMP "bridge-vscode-user"
          $extensions = Join-Path $env:RUNNER_TEMP "bridge-vscode-extensions"
          New-Item -ItemType Directory -Force -Path $userData, $extensions | Out-Null
          $vsix = (Resolve-Path ".\artifacts\chatgpt-bridge-vscode-0.2.0.vsix").Path

          & $code.Source --user-data-dir $userData --extensions-dir $extensions --install-extension $vsix --force
          if ($LASTEXITCODE -ne 0) { throw "VSIX install into clean VS Code profile failed." }
          $installed = & $code.Source --user-data-dir $userData --extensions-dir $extensions --list-extensions --show-versions
          if ($LASTEXITCODE -ne 0 -or $installed -notcontains "chathurangabw.chatgpt-bridge-vscode@0.2.0") {
            throw "Installed extension/version was not found in the clean VS Code profile."
          }

          & $code.Source --user-data-dir $userData --extensions-dir $extensions --uninstall-extension chathurangabw.chatgpt-bridge-vscode
          if ($LASTEXITCODE -ne 0) { throw "VSIX uninstall from clean VS Code profile failed." }
          $remaining = & $code.Source --user-data-dir $userData --extensions-dir $extensions --list-extensions --show-versions
          if ($remaining -contains "chathurangabw.chatgpt-bridge-vscode@0.2.0") {
            throw "Extension remained installed after uninstall."
          }
      - name: Export VSIX release artifact
        uses: actions/upload-artifact@v7
        with:
          name: chatgpt-bridge-vscode-0.2.0
          path: artifacts/chatgpt-bridge-vscode-0.2.0.vsix
          if-no-files-found: error
