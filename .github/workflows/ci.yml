name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run qa
      - name: Smoke cloud OAuth and MCP relay
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "cloud-worker.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "cloud-worker.err.log"
          $worker = Start-Process -FilePath "npm.cmd" -ArgumentList @(
            "run", "dev", "--workspace", "cloud-worker", "--", "--port", "8787"
          ) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($worker.HasExited) {
                Get-Content $stdout -ErrorAction SilentlyContinue
                Get-Content $stderr -ErrorAction SilentlyContinue
                throw "Wrangler dev exited before /health became ready (exit code $($worker.ExitCode))."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 1
                if ($health.ok -eq $true) {
                  $ready = $true
                  break
                }
              } catch {
                # workerd may still be starting.
              }
            }
            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Cloud Worker did not expose /health within the smoke-test window."
            }
            npm run smoke --workspace cloud-worker
            if ($LASTEXITCODE -ne 0) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Cloud relay runtime smoke failed."
            }
          } finally {
            if (-not $worker.HasExited) {
              Stop-Process -Id $worker.Id -Force
            }
          }
      - name: Package release artifacts
        run: npm run package:release
      - name: Smoke packaged bridge executable
        shell: pwsh
        env:
          BRIDGE_CLOUD_DISABLED: "true"
        run: |
          $process = Start-Process -FilePath ".\artifacts\ChatGPTBridge.exe" -PassThru -WindowStyle Hidden -Environment @{ BRIDGE_CLOUD_DISABLED = "true" }
          $collision = $null
          $badConfig = $null
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) {
                throw "ChatGPTBridge.exe exited before the health endpoint became available (exit code $($process.ExitCode))."
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:47322/health" -TimeoutSec 1
                if ($health.ok -eq $true -and $health.vscodeConnected -eq $false) {
                  $ready = $true
                  break
                }
              } catch {
                # The packaged process may still be starting.
              }
            }
            if (-not $ready) { throw "ChatGPTBridge.exe did not expose a healthy loopback endpoint within the smoke-test window." }

            $collision = Start-Process -FilePath ".\artifacts\ChatGPTBridge.exe" -PassThru -WindowStyle Hidden -Environment @{ BRIDGE_CLOUD_DISABLED = "true" }
            if (-not $collision.WaitForExit(10000)) { throw "A second ChatGPTBridge.exe did not fail on occupied default ports." }
            if ($collision.ExitCode -eq 0) { throw "A second ChatGPTBridge.exe unexpectedly exited successfully on occupied ports." }

            $healthAfterCollision = Invoke-RestMethod -Uri "http://127.0.0.1:47322/health" -TimeoutSec 2
            if ($healthAfterCollision.ok -ne $true) { throw "The original bridge became unhealthy after the port-collision smoke test." }

            $badConfig = Start-Process -FilePath ".\artifacts\ChatGPTBridge.exe" -PassThru -WindowStyle Hidden -Environment @{
              BRIDGE_WS_PORT = "47321abc"
              BRIDGE_MCP_PORT = "57322"
              BRIDGE_CLOUD_DISABLED = "true"
            }
            if (-not $badConfig.WaitForExit(10000)) { throw "ChatGPTBridge.exe did not reject a malformed BRIDGE_WS_PORT value." }
            if ($badConfig.ExitCode -eq 0) { throw "ChatGPTBridge.exe unexpectedly accepted a malformed BRIDGE_WS_PORT value." }
          } finally {
            foreach ($candidate in @($badConfig, $collision, $process)) {
              if ($null -ne $candidate -and -not $candidate.HasExited) { Stop-Process -Id $candidate.Id -Force }
            }
          }
      - name: Export release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chatgpt-bridge-windows-0.2.0
          path: |
            artifacts/ChatGPTBridge.exe
            artifacts/chatgpt-bridge-vscode-0.2.0.vsix
            artifacts/cloud-worker/**
          if-no-files-found: error
