name: Deploy ChatGPT Bridge Worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: development
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

concurrency:
  group: chatgpt-bridge-worker-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: bridge-${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRIDGE_PUBLIC_URL: ${{ vars.BRIDGE_PUBLIC_URL || 'https://lucky-heart-f5b9.chatgpt-bridge.workers.dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Refuse production deploy from non-main branch
        if: inputs.target == 'production' && github.ref_name != 'main'
        shell: bash
        run: |
          echo "Production deployments must run from main; selected ref is $GITHUB_REF_NAME." >&2
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Validate release tree
        run: npm run qa

      - name: Verify operator credentials exist
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN environment secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID environment secret." >&2; exit 1; }

      - name: Deploy Worker
        run: npx wrangler deploy --config cloud-worker/wrangler.jsonc

      - name: Wait for deployed health endpoint
        shell: bash
        run: |
          node <<'NODE'
          const base = process.env.BRIDGE_PUBLIC_URL.replace(/\/+$/, '');
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              const response = await fetch(`${base}/health`, { signal: AbortSignal.timeout(3000) });
              const body = response.ok ? await response.json() : null;
              if (response.ok && body?.ok === true) {
                console.log(`Worker healthy at ${base}`);
                process.exit(0);
              }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 2000));
          }
          console.error(`Worker did not become healthy at ${base}`);
          process.exit(1);
          NODE

      - name: Verify hosted landing UI
        shell: bash
        run: |
          node <<'NODE'
          const base = process.env.BRIDGE_PUBLIC_URL.replace(/\/+$/, '');
          const response = await fetch(`${base}/`);
          const body = await response.text();
          if (!response.ok || !body.includes('Bridge relay online') || !body.includes('/mcp')) {
            console.error('Hosted Bridge landing page did not match the deployed product UI.');
            process.exit(1);
          }
          console.log('Hosted product UI passed.');
          NODE

      - name: Verify deployed OAuth and MCP relay
        env:
          BRIDGE_SMOKE_URL: ${{ env.BRIDGE_PUBLIC_URL }}
        run: node cloud-worker/test/runtime-smoke.mjs

      - name: Verify deployed authorization UI
        env:
          BRIDGE_SMOKE_URL: ${{ env.BRIDGE_PUBLIC_URL }}
        run: node cloud-worker/test/authorize-ui-smoke.mjs

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## ChatGPT Bridge Worker deployed"
            echo ""
            echo "- Target: ${{ inputs.target }}"
            echo "- Git ref: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- MCP: $BRIDGE_PUBLIC_URL/mcp"
            echo "- Post-deploy runtime smoke: passed"
            echo "- Hosted UI smoke: passed"
            echo ""
            echo "Next operator step: open the ChatGPT Bridge connection in ChatGPT Plugins and select **Refresh** so ChatGPT reloads OAuth, tool, and UI metadata."
          } >> "$GITHUB_STEP_SUMMARY"
