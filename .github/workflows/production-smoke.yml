name: Production Worker Smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe production Worker beyond known missing issuer
        env:
          BRIDGE_SMOKE_URL: https://lucky-heart-f5b9.chatgpt-bridge.workers.dev
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = 'cloud-worker/test/runtime-smoke.mjs';
          const target = 'cloud-worker/test/runtime-smoke-production.mjs';
          const original = fs.readFileSync(source, 'utf8');
          const needle = '  assert.equal(callback.searchParams.get("iss"), baseUrl);';
          if (!original.includes(needle)) throw new Error('Expected issuer assertion was not found.');
          fs.writeFileSync(target, original.replace(needle, '  // QA-only production characterization: missing iss already recorded as a blocker.'));
          NODE
          node cloud-worker/test/runtime-smoke-production.mjs
